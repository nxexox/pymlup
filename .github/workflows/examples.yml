name: Examples smoke tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  examples-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sklearn
            # pymlup extra installed from the current checkout (see "Install pymlup" step),
            # not from examples/*/requirements.txt - that file pins a PyPI release for end
            # users, but this job must exercise the library code from this branch/PR.
            pymlup_extra: "[scikit-learn]"
            extra_pip: ""
            prepare_cmd: "python train.py"
            start_cmd: "mlup run -m model.pkl"
            predict_body: '{"X": [[1, 1], [3, 3]]}'
            expected_predict: '{"predict_result": [0, 1]}'
          - name: custom-python-model
            pymlup_extra: ""
            extra_pip: ""
            prepare_cmd: "true"
            start_cmd: "python run.py"
            predict_body: '{"X": [[1, 2], [3, 4]]}'
            expected_predict: '{"predict_result": [3, 7]}'
          - name: onnx
            pymlup_extra: "[onnx]"
            # Needed only to build the example's model.onnx (prepare_model.py), not to serve it.
            extra_pip: "scikit-learn skl2onnx"
            prepare_cmd: "python prepare_model.py"
            start_cmd: "mlup run -m model.onnx --up.dtype_for_predict=float32"
            predict_body: '{"input_data": [[1, 1], [3, 3]]}'
            expected_predict: '{"predict_result": [[0, 1], [[1.0, 0.0], [0.0, 1.0]]]}'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Install pymlup (current checkout) and example dependencies
        working-directory: examples/${{ matrix.name }}
        run: |
          python -m pip install --upgrade pip
          pip install -e "${GITHUB_WORKSPACE}${{ matrix.pymlup_extra }}"
          if [ -n "${{ matrix.extra_pip }}" ]; then
            pip install ${{ matrix.extra_pip }}
          fi

      - name: Prepare model
        working-directory: examples/${{ matrix.name }}
        run: ${{ matrix.prepare_cmd }}

      - name: Start server
        working-directory: examples/${{ matrix.name }}
        run: |
          nohup ${{ matrix.start_cmd }} < /dev/null > server.log 2>&1 &
          echo $! > server.pid
          disown

      - name: Wait for /health
        working-directory: examples/${{ matrix.name }}
        timeout-minutes: 3
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -f http://localhost:8009/health; then
              echo "Server is up after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy in time."
          cat server.log
          exit 1

      - name: Check /health and /predict
        working-directory: examples/${{ matrix.name }}
        run: |
          python3 - <<'PYEOF'
          import json
          import urllib.request

          def get(url):
              with urllib.request.urlopen(url, timeout=10) as r:
                  return json.load(r)

          def post(url, body):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.load(r)

          health = get("http://localhost:8009/health")
          assert health == {"status": 200}, f"Unexpected /health response: {health!r}"

          predict_body = json.loads('''${{ matrix.predict_body }}''')
          expected = json.loads('''${{ matrix.expected_predict }}''')
          predict = post("http://localhost:8009/predict", predict_body)
          assert predict == expected, f"Unexpected /predict response: {predict!r}, expected {expected!r}"

          print("OK - /health:", health)
          print("OK - /predict:", predict)
          PYEOF

      - name: Show server log
        if: always()
        working-directory: examples/${{ matrix.name }}
        run: cat server.log || true

      - name: Stop server
        if: always()
        working-directory: examples/${{ matrix.name }}
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
