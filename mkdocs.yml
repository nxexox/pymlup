site_name: MLup
site_url: https://mlup.org/
site_description: >-
  Turn Python objects and serialized machine learning models (scikit-learn, lightgbm,
  tensorflow, torch, onnx) into self-hosted FastAPI REST APIs without writing serving
  boilerplate.

repo_url: https://github.com/nxexox/pymlup
repo_name: PyMLup

nav:
  - Home: README.md
  - Quickstart: quickstart.md
  - Configuration file: config_file.md
  - Application life cycle: life_cycle.md
  - Storages: storages.md
  - Binarizers: binarizers.md
  - Data Transformers: data_transformers.md
  - Web app architectures: web_app_architectures.md
  - Web app API: web_app_api.md
  - Python interface: python_interface.md
  - Bash commands: bash_commands.md

theme:
  name: material
  language: en
  custom_dir: docs
  logo: assets/img/logo_without_text_grey_with_background.png
  features:
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - offline
  favicon: assets/img/favicon.png
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: "teal"
      accent: "cyan"

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: "cyan"
      accent: "teal"

extra:
  homepage: https://mlup.org
  analytics:
    provider: custom
  version:
    provider: mike
    default: stable
